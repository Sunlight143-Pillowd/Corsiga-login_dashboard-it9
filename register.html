<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="register-container">
        <h1>Register</h1>
        <form method="post" action="login.html" class="register-form">
            <label for="new-full-name">Full Name:</label>
            <input type="text" id="new-full-name" name="new-full-name" required><br><br>

            <label for="new-username">Username:</label>
            <input type="text" id="new-username" name="new-username" required><br><br>

            <label for="new-username">Password:</label>
            <input type="password" id="new-password" name="new-password" required><br><br>

            <label for="new-confirm-password">Confirm Password:</label>
            <input type="password" id="new-confirm-password" name="new-confirm-password" required><br><br>
            <button type="submit" class="register-button">Register</button>
        </form>
    </div>
</body>
</html>
